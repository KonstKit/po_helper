# Dev-only nginx config (mounted by docker-compose.dev.yml).
#
# In docker-compose.dev.yml the backend uses network_mode: host (strict
# localhost demo) and is therefore not on the Compose bridge network. The
# frontend container reaches it via `extra_hosts: ["backend:host-gateway"]`
# which adds `backend -> <host-gateway>` to /etc/hosts.
#
# Important: nginx only consults /etc/hosts when proxy_pass is given a
# *literal* hostname. With a variable (e.g. `set $upstream http://backend:8000;`
# `proxy_pass $upstream;`) nginx defers resolution to the configured
# `resolver`, which is Docker's embedded DNS at 127.0.0.11 — and Docker DNS
# does NOT read /etc/hosts. So in dev we use literal `proxy_pass` so the
# host-gateway mapping is honoured at config-load time.
#
# Production stays on the bridge-networked default nginx.conf (with the
# resolver-based variable form) so backend container restarts do not pin a
# stale IP.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket: literal proxy_pass so /etc/hosts is honoured.
    location = /api/v1/ws {
        proxy_pass http://backend:8000/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # API proxy: literal proxy_pass so /etc/hosts is honoured.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}
