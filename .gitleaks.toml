# Gitleaks configuration for po_helper.
#
# Extends the built-in rule set and baselines the 17 historical false
# positives analyzed in docs/security/gitleaks-findings-2026-08.md:
# the atlassian-api-token rule matches the 24-char function name
# listConfluencePagesLocal inside generated static-analysis CSV exports
# (analysis_output/runs/*.csv, original commit 3d169f5, rewritten to
# d558c0e by the 2026-09-04 history purge).
#
# History note: the GitLab token from the initial commit (backend/
# test_gitlab_sync.py) was ROTATED on 2026-09-04 and the value was
# purged from history in the same pass (git filter-repo), so no entry
# is needed for it anymore.
#
# Syntax note: the singular [allowlist] table with condition = "AND"
# (the version pinned by gitleaks-action@v2 in CI); the newer plural
# [[allowlists]] form is intentionally avoided. The allowlist only
# suppresses findings whose commit AND exact historical path both
# match, so any new leak still fails the scan.

[extend]
useDefault = true

[allowlist]
description = "Baseline of 17 historical CSV false positives - see docs/security/gitleaks-findings-2026-08.md"
condition = "AND"
commits = [
  "d558c0edf80315d820d09ca22ff9913ab772fbe5",
]
paths = [
  "^analysis_output/runs/20260121-154214_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154214_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154231_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154231_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154231_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-154559_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154559_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154559_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-154739_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154739_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154739_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-155404_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-155404_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-155404_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-160255_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-160255_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-160255_b562249/unused_with_tests\\.csv$",
]
