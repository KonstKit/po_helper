# Gitleaks configuration for po_helper.
#
# Extends the built-in rule set and baselines the 18 historical findings
# analyzed in docs/security/gitleaks-findings-2026-08.md:
#
# 1. 17 x atlassian-api-token in analysis_output/runs/*.csv (commit
#    3d169f5) - false positives: the 24-char function name
#    listConfluencePagesLocal in generated static-analysis exports
#    matches the token shape. The directory was later removed from the
#    tip but remains in history.
#
# 2. 1 x generic-api-key in backend/test_gitlab_sync.py (initial commit
#    c31e420) - a real-looking GitLab token that still exists in
#    history. It must be ROTATED on the GitLab side; after an optional
#    history purge this entry can be removed so any recurrence is
#    re-flagged.
#
# Syntax note: the singular [allowlist] table with condition = "AND"
# is the only allowlist form supported by gitleaks 8.24.3 (the version
# pinned by gitleaks-action@v2 in CI); the newer plural [[allowlists]]
# form is intentionally avoided. The allowlist only suppresses findings
# whose commit AND exact historical path both match, so any new leak -
# including reuse of the rotated token anywhere else - still fails the
# scan.

[extend]
useDefault = true

[allowlist]
description = "Baseline of 18 historical findings - see docs/security/gitleaks-findings-2026-08.md"
condition = "AND"
commits = [
  "3d169f5007ef076f11856796a361c9e2a6236cb0",
  "c31e420843396d0f6df6cc42577d02a4de28e627",
]
paths = [
  "^analysis_output/runs/20260121-154214_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154214_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154231_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154231_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154231_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-154559_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154559_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154559_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-154739_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-154739_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-154739_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-155404_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-155404_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-155404_b562249/unused_with_tests\\.csv$",
  "^analysis_output/runs/20260121-160255_b562249/methods\\.csv$",
  "^analysis_output/runs/20260121-160255_b562249/unused_prod\\.csv$",
  "^analysis_output/runs/20260121-160255_b562249/unused_with_tests\\.csv$",
  "^backend/test_gitlab_sync\\.py$",
]
