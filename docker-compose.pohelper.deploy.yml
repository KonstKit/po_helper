version: '3.8'

# Development Docker Compose with adjusted ports
# Redis port changed from 6379 to 6381 to avoid conflicts

services:
  postgres:
    image: postgres:15
    container_name: po_helper_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: po_helper
    ports:
      - "5432:5432"
    volumes:
      - po_helper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - po_helper_network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: po_helper_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: sh -c 'exec redis-server --port 6381 --requirepass "$REDIS_PASSWORD"'
    ports:
      - "6381:6381"
    volumes:
      - po_helper_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6381 -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - po_helper_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: po_helper_backend
    # --proxy-headers + forwarded-allow-ips (B3): trust only the
    # compose-internal nginx proxy so rate limiting and logging see real
    # client IPs instead of the docker gateway address. uvicorn matches
    # trusted proxies by literal IP (no CIDR), so the frontend service
    # pins a static address on a dedicated network below.
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers
      --forwarded-allow-ips=$${UVICORN_FORWARDED_ALLOW_IPS:-172.28.0.2}"
    ports:
      - "8001:8000"
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/po_helper
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      po_helper_network:
      # Pin the backend away from 172.28.0.2, which the frontend nginx
      # proxy must own (uvicorn --forwarded-allow-ips trusts it by
      # literal IP); unpinned assignment made the backend race the
      # frontend for that address.
      po_net:
        ipv4_address: 172.28.0.3
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    networks:
      po_net:
        ipv4_address: 172.28.0.2
    container_name: po_helper_frontend
    ports:
      - "3001:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  frontend-tooling:
    image: node:20-alpine
    container_name: po_helper_frontend_tooling
    working_dir: /app
    environment:
      - CI=1
      - PUPPETEER_SKIP_DOWNLOAD=1
    volumes:
      - ./frontend:/app
      - po_helper_frontend_node_modules:/app/node_modules
    command: sh -lc "npm ci && tail -f /dev/null"
    profiles:
      - tools
    networks:
      - po_helper_network

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: po_helper_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/po_helper
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - po_helper_network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: po_helper_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/po_helper
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6381/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - po_helper_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  po_helper_postgres_data:
  po_helper_redis_data:
  po_helper_frontend_node_modules:

networks:
  po_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  po_helper_network:
    driver: bridge

