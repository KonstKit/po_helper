name: quality

on:
  push:
  pull_request:

jobs:
  bom-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: BOM gate
        run: python3 scripts/check_bom.py

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python3 -m pip install -r backend/requirements.txt
      - name: Ruff format check
        run: python3 -m ruff format --check backend/app
      - name: Ruff lint
        run: python3 -m ruff check --config backend/ruff.toml backend/app
      - name: Mypy
        run: python3 -m mypy --config-file backend/mypy.ini backend/app
      - name: Import layering gate
        run: python3 scripts/check_imports.py --root backend/app/services
      - name: Pytest
        run: PYTHONPATH=backend pytest backend/tests -q

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
