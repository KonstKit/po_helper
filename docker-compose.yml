version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: po_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 
    ports:
      - "8000:8000"
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=
      - REDIS_URL=
      - ENVIRONMENT=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=
      - REDIS_URL=
      - ENVIRONMENT=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=
      - REDIS_URL=
      - ENVIRONMENT=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
