version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: po_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --port 6381
    ports:
      - "6381:6381"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # --proxy-headers + forwarded-allow-ips (B3): trust only the
    # compose-internal nginx proxy so rate limiting and logging see real
    # client IPs instead of the docker gateway address. uvicorn matches
    # trusted proxies by literal IP (no CIDR), so the frontend service
    # pins a static address on a dedicated network below.
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers
      --forwarded-allow-ips=$${UVICORN_FORWARDED_ALLOW_IPS:-172.28.0.2}"
    ports:
      - "8000:8000"
    env_file:
      - .env
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    restart: unless-stopped
    networks:
      - default
      - po_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    networks:
      po_net:
        ipv4_address: 172.28.0.2
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend-tooling:
    image: node:20-alpine
    working_dir: /app
    environment:
      - CI=1
      - PUPPETEER_SKIP_DOWNLOAD=1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "npm ci && tail -f /dev/null"
    profiles:
      - tools

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  po_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
