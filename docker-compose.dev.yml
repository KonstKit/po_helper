version: '3.8'

# Development Docker Compose with adjusted ports
# Redis port changed from 6379 to 6381 to avoid conflicts

services:
  postgres:
    image: postgres:15
    container_name: po_helper_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: po_helper
    ports:
      - "5432:5432"
    volumes:
      - po_helper_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - po_helper_network

  redis:
    image: redis:7-alpine
    container_name: po_helper_redis
    command: redis-server --port 6381
    ports:
      - "6381:6381"
    volumes:
      - po_helper_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - po_helper_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: po_helper_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/po_helper
      - REDIS_URL=redis://redis:6381/0
      - CELERY_BROKER_URL=redis://redis:6381/0
      - CELERY_RESULT_BACKEND=redis://redis:6381/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - po_helper_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: po_helper_frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - po_helper_network

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: po_helper_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/po_helper
      - REDIS_URL=redis://redis:6381/0
      - CELERY_BROKER_URL=redis://redis:6381/0
      - CELERY_RESULT_BACKEND=redis://redis:6381/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - po_helper_network

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: po_helper_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file:
      - .env
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/po_helper
      - REDIS_URL=redis://redis:6381/0
      - CELERY_BROKER_URL=redis://redis:6381/0
      - CELERY_RESULT_BACKEND=redis://redis:6381/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped
    networks:
      - po_helper_network

volumes:
  po_helper_postgres_data:
  po_helper_redis_data:

networks:
  po_helper_network:
    driver: bridge
